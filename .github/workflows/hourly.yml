name: hourly benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Optional comma-separated provider subset
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: benchmark-main
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Build repository context when exactly one pinned repo is selected
        id: context
        continue-on-error: true
        run: python -m dsbench.cli prepare-context --output .cache/context.txt
      - name: Run all providers concurrently
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          HAI_API_KEY: ${{ secrets.HAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          PROVIDERS: ${{ inputs.providers }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -f .cache/context.txt ]]; then args+=(--context-file .cache/context.txt); fi
          if [[ -n "${PROVIDERS:-}" ]]; then args+=(--providers "$PROVIDERS"); fi
          python -m dsbench.cli run "${args[@]}"
          python -m dsbench.cli aggregate
      - name: Update compact statistics
        if: always()
        shell: bash
        run: |
          if [[ -f results/hourly.csv ]]; then
            python -m dsbench.stats \
              --github-run-id "$GITHUB_RUN_ID" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Validate provider results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import pathlib
          import sys

          path = pathlib.Path("results/hourly.csv")
          if not path.exists():
              print("No provider results were recorded", file=sys.stderr)
              raise SystemExit(1)
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          if not rows:
              print("No provider results were recorded", file=sys.stderr)
              raise SystemExit(1)
          failed = [row for row in rows if row.get("status") != "ok"]
          if failed:
              summary = ", ".join(f"{row.get('provider')}={row.get('status')}" for row in failed)
              print(f"Provider benchmark failures: {summary}", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Test harness
        if: always()
        run: python -m pip install -e '.[dev]' && pytest -q
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsbench-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish statistics to main
        if: always()
        shell: bash
        run: |
          if [[ ! -f data/history.csv || ! -f STATS.md ]]; then
            exit 0
          fi
          git add data/history.csv STATS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update benchmark statistics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
