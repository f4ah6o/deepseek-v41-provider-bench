[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deepseek-v41-provider-bench"
version = "0.1.0"
description = "Reproducible DeepSeek V4.1 Flash provider benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dsbench = "dsbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
